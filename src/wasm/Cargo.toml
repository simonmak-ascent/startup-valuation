[package]
name = "startup-valuation-wasm"
version = "1.0.2"
edition = "2021"
description = "WebAssembly valuation engine — 60+ startup valuation formulas running client-side at native speed"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
