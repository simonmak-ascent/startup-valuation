              - paragraph [ref=e768]: Simon Mak believes sustainability shouldn’t be complicated. As the founder of Ascent Partners Group Limited and Ascent Partners Foundation, he’s dedicated to helping businesses turn ESG and nature-related reporting from a burden into a real advantage. His Made Simple series—including ESG Reporting Made Simple and TNFD Made Simple—translates complex frameworks into clear, practical steps anyone can follow.
              - paragraph [ref=e769]: Simon is a graduate of the Cambridge Institute for Sustainability Leadership (CISL) and an active voice in global sustainability conversations, from advising organizations to speaking at forums like COP28. Through his foundation work, he champions biodiversity, climate resilience, and corporate responsibility across Asia and beyond.
