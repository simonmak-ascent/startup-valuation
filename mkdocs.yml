site_name: Startup Valuation
site_description: Comprehensive startup valuation library with 80+ formulas, MCP server, and AI-agent skills
site_author: Ascent Partners
site_url: https://simonmak-ascent.github.io/startup-valuation/
repo_url: https://github.com/simonmak-ascent/startup-valuation
repo_name: simonmak-ascent/startup-valuation
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/ascent-logo.png
  favicon: assets/images/ascent-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

extra:
  # No analytics provider: the site sets no cookies and runs no third-party script, and the privacy
  # page says so. `theme.font: false` above keeps Material from loading Google Fonts.
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ascent-partners-group-
      name: Ascent Partners on LinkedIn
  generator: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
      - Probability: api/probability.md
      - Time Value: api/tv.md
      - CAPM: api/capm.md
      - Core Methods: api/core.md
      - Advanced: api/advanced.md
      - Comparables: api/comparables.md
      - SaaS: api/saas.md
      - Biotech: api/biotech.md
      - Fintech: api/fintech.md
      - Marketplace: api/marketplace.md
      - Hardware: api/hardware.md
      - International: api/international.md
      - Stakeholders: api/stakeholders.md
      - Emerging: api/emerging.md
  - MCP Server: mcp-server.md
  - Agent Skills: agent-skills.md
  - Examples:
      - Core Methods: examples/core-methods.md
      - Advanced Methods: examples/advanced-methods.md
      - Industry Models: examples/industry-models.md
      - Valuing Pre-Revenue SaaS: examples/valuing-pre-revenue-saas.md
      - Example Template: examples/README.md
  - Chapter Index: chapters.md
  - Reference:
      - Notation: notation.md
      - Cross-Reference: cross-reference.md
  - Troubleshooting: troubleshooting.md

# Internal planning documents, deliberately not published.
#
# They are working papers: they describe routes and gaps from an earlier state of the app, and
# several name endpoints that no longer exist (`/api/auth/session`, `/api/audit/route`,
# `/api/export/report`). mkdocs builds every file under `docs_dir` whether or not it is in the nav,
# so before this they were served at /docs/plan/ and read as current documentation.
#
# They are also `.gitignore`d, so a clone does not contain them at all; this list exists for the
# workstation, where the files are still on disk and a local `mkdocs build` would otherwise publish
# them. `tests-ci/test_docs_alignment.py` asserts these six are still excluded and that no other
# document is published while naming an `/api` route the app does not serve.
exclude_docs: |
  plan.md
  plan-context.md
  plan-product.md
  plan-delivery.md
  test-plan.md
  plan-15min.md
