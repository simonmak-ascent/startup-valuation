name: Documentation Improvement
description: Suggest an improvement to the documentation
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation.
  - type: input
    id: page
    attributes:
      label: Affected Page
      description: Which page or section needs improvement?
      placeholder: "e.g., API Reference / Core Methods"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current State
      description: What is currently wrong or missing?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested Improvement
      description: What should it say or look like instead?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
