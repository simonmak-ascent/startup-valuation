name: Lighthouse CI

on:
  push:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://startup-valuation.ascent-partners.com
            https://startup-valuation.ascent-partners.com/methods/scorecard
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
