name: Lighthouse CI

on:
  push:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://startup-valuation.simonmak.com
            https://startup-valuation.simonmak.com/methods/scorecard
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
