name: image

# Build and publish the web application image.
#
# Building needs a runner with **Docker socket access**. It runs on `apg-ecs-01` — a runner on
# workforce-01 whose user is in the `docker` group. It must NOT run on the `apg-ci-04` control-node
# runner, which has no docker socket by design (apg-infra OI-60): that failure mode was a 27-second
# socket error, and before the runner existed it was a nine-minute silent queue.
#
# The first step checks for Docker so a misrouted job fails with a message instead of hanging.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Optional local image tag to push instead of building (name:stamp)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    runs-on: [self-hosted, apg-ecs-01]
    steps:
      - name: Check the runner can reach Docker
        run: |
          if ! docker version --format '{{.Server.Version}}' >/dev/null 2>&1; then
            echo "::error::this runner has no Docker socket. Image builds need a runner on an application node (apg-ecs-01/02/03), where the deploy user is in the docker group. See this workflow's header."
            exit 1
          fi
          echo "docker $(docker version --format '{{.Server.Version}}')"

      - uses: actions/checkout@v7
        if: inputs.image == ''

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        run: |
          set -eu
          repo="ghcr.io/${{ github.repository }}"
          if [ -n "${{ inputs.image }}" ]; then
            src="${{ inputs.image }}"
            case "$src" in *:*) ;; *) echo "image must be name:stamp (got $src)" >&2; exit 1 ;; esac
            dst="$repo:${src#*:}"
            docker tag "$src" "$dst"
          else
            dst="$repo:$(date -u +%Y%m%dT%H%M%S)"
            docker build -f Dockerfile.web -t "$dst" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" .
          fi
          docker push "$dst"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$dst")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### published"
            echo ""
            echo '```'
            echo "$digest"
            echo '```'
            echo ""
            echo "Pin it in \`container.json\` as \`image: $digest\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
