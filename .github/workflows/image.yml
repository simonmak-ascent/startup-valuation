name: image

# Build and publish the web application image.
#
# Building needs a runner with **Docker socket access**. It runs on `apg-ecs-01` — a runner on
# workforce-01 whose user is in the `docker` group. It must NOT run on the `apg-ci-04` control-node
# runner, which has no docker socket by design (apg-infra OI-60): that failure mode was a 27-second
# socket error, and before the runner existed it was a nine-minute silent queue.
#
# The first step checks for Docker so a misrouted job fails with a message instead of hanging.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Optional local image tag to push instead of building (name:stamp)"
        required: false
        type: string
  # Auto-deploy, stage 1: every push to main builds. A pin commit is not a source change.
  # `docs/**` now IS image content — it is built into `public/docs` by the step below — so a
  # docs-only merge must rebuild, or /docs serves the previous edit until an unrelated push does.
  push:
    branches: [main]
    paths-ignore:
      - container.json
      - '*.md'                   # root-level notes; `docs/**.md` must rebuild the image
      - '.github/workflows/**'   # a pipeline change cannot alter the image it builds

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    runs-on: [self-hosted, apg-ecs-01]
    steps:
      - name: Check the runner can reach Docker
        run: |
          if ! docker version --format '{{.Server.Version}}' >/dev/null 2>&1; then
            echo "::error::this runner has no Docker socket. Image builds need a runner on an application node (apg-ecs-01/02/03), where the deploy user is in the docker group. See this workflow's header."
            exit 1
          fi
          echo "docker $(docker version --format '{{.Server.Version}}')"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.image == ''

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `/docs` has been a 404 since the site was containerised: `site/` is gitignored and built by
      # `mkdocs build`, and `Dockerfile.web` copied only `public/`. Building it here puts the pages in
      # the image the app serves, which is what makes them reachable at all. setup-python installs
      # into the tool cache, outside the checkout, so `COPY . .` carries only `public/docs`.
      # `actions/setup-python`, not a venv: `python3 -m venv` needs `python3-venv`, which is absent
      # on this workstation and unverified on the runner — and the image build is the deploy path, so
      # it may not depend on a package nobody has checked. The docs job already works this way.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: inputs.image == ''
        with:
          python-version: "3.12"

      - name: Build the docs site into public/docs
        # The checkout above is skipped when a local image is being pushed, so there is nothing to
        # build docs from — without this the step fails on a missing pyproject.toml, not on anything
        # real, and the documented `-f image=…` dispatch stops working.
        if: inputs.image == ''
        run: |
          set -eu
          python -m pip install --quiet --upgrade pip
          pip install --quiet -e ".[docs]"
          mkdocs build --strict
          rm -rf public/docs
          cp -r site public/docs
          # MkDocs writes relative hrefs for a directory URL that ends in a slash; Next serves the
          # rewrite at the slash-less URL the user asked for, so every page would resolve its own
          # stylesheet one directory too high. This rewrites them to the files they mean.
          python3 scripts/absolutise_docs.py public/docs
          echo "pages: $(find public/docs -name 'index.html' | wc -l), assets: $(find public/docs -type f ! -name '*.html' | wc -l)"

      - name: Build and push
        id: build
        # `inputs.image` is interpolated into `env`, never into the `run:` body. A `${{ }}`
        # expression in shell source is substituted before the shell parses it, so a dispatch input
        # becomes command execution on the node that holds the Docker socket.
        env:
          IN_IMAGE: ${{ inputs.image }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          repo="ghcr.io/$REPO"
          if [ -n "$IN_IMAGE" ]; then
            src="$IN_IMAGE"
            case "$src" in *:*) ;; *) echo "image must be name:stamp (got $src)" >&2; exit 1 ;; esac
            dst="$repo:${src#*:}"
            docker tag "$src" "$dst"
          else
            dst="$repo:$(date -u +%Y%m%dT%H%M%S)"
            docker build -f Dockerfile.web -t "$dst" \
              --label "org.opencontainers.image.source=https://github.com/$REPO" \
              --label "org.opencontainers.image.revision=$SHA" .
          fi
          docker push "$dst"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$dst")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### published"
            echo ""
            echo '```'
            echo "$digest"
            echo '```'
            echo ""
            echo "Pin it in \`container.json\` as \`image: $digest\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The digest is the artefact pin-digest.yml needs; the job summary is for humans.
      - name: Publish the digest for the pin step
        if: inputs.image == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > digest.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.image == ''
        with:
          name: digest
          path: digest.txt
          retention-days: 1

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
