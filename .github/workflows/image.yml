name: image

# Build and publish the web application image.
#
# READ THIS BEFORE DISPATCHING — it cannot succeed today.
#
# Building needs a runner with **Docker socket access**. The only runner registered for this
# repository is `ecs-04-intangible-valuation` on the **control node**, and that node has no
# Docker socket by design (apg-infra: the control plane runs no applications, and its runner
# user is not in the `docker` group). The application nodes' `deploy` user *is* in `docker`,
# but no runner is registered there for this repository — so `runs-on: apg-ecs-01` queues
# forever, which is exactly what happened on 2026-10-29.
#
# So the job checks for Docker first and fails with an explicit message rather than hanging.
# The image is currently built **by hand on an application node** from `Dockerfile.web`:
#
#   docker build -f Dockerfile.web -t startup-valuation:$(date -u +%Y%m%dT%H%M%S) .
#
# and published by whatever runner can reach the socket. Registering a runner on
# apg-ecs-01/02/03 for this repository would make this workflow work unchanged.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Optional local image tag to push instead of building (name:stamp)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    runs-on: [self-hosted, apg-ci-04]
    steps:
      - name: Check the runner can reach Docker
        run: |
          if ! docker version --format '{{.Server.Version}}' >/dev/null 2>&1; then
            echo "::error::this runner has no Docker socket. Image builds need a runner on an application node (apg-ecs-01/02/03), where the deploy user is in the docker group. See this workflow's header."
            exit 1
          fi
          echo "docker $(docker version --format '{{.Server.Version}}')"

      - uses: actions/checkout@v7
        if: inputs.image == ''

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        run: |
          set -eu
          repo="ghcr.io/${{ github.repository }}"
          if [ -n "${{ inputs.image }}" ]; then
            src="${{ inputs.image }}"
            case "$src" in *:*) ;; *) echo "image must be name:stamp (got $src)" >&2; exit 1 ;; esac
            dst="$repo:${src#*:}"
            docker tag "$src" "$dst"
          else
            dst="$repo:$(date -u +%Y%m%dT%H%M%S)"
            docker build -f Dockerfile.web -t "$dst" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" .
          fi
          docker push "$dst"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$dst")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### published"
            echo ""
            echo '```'
            echo "$digest"
            echo '```'
            echo ""
            echo "Pin it in \`container.json\` as \`image: $digest\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
