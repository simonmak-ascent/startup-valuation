name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src/ tests/ api/ mcp_server/ method_registry/ scripts/

      - name: Type check
        run: mypy src/startup_valuation --ignore-missing-imports

      - name: Registry determinism gate
        run: |
          python scripts/generate.py
          git diff --exit-code -- lib/methods/ || (echo "lib/methods/*.ts are out of date; run 'python scripts/generate.py'." && exit 1)

      - name: Run tests
        run: pytest --cov=startup_valuation --cov-report=term-missing --cov-fail-under=85 -v

  web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Gate on NPM_TOKEN (private @simonplmak-cloud/auth registry). Add it as a
    # GitHub Actions secret to enable the TypeScript + vitest quality gate.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + type-check + unit tests
        if: env.NPM_TOKEN != ''
        run: |
          pnpm install --no-frozen-lockfile
          pnpm check
          pnpm test

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check --strict dist/*
