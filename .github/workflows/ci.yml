name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src/ tests/ api/ method_registry/ scripts/

      - name: Type check
        run: mypy src/startup_valuation --ignore-missing-imports

      - name: Registry + MCP surface determinism gate
        run: |
          python scripts/generate.py
          python scripts/generate_mcp.py
          git diff --exit-code -- lib/methods/ || (echo "lib/methods/*.ts are out of date; run 'python scripts/generate.py'." && exit 1)
          git diff --exit-code -- src/startup_valuation/mcp/server.py || (echo "src/startup_valuation/mcp/server.py is out of date; run 'python scripts/generate_mcp.py'." && exit 1)

      - name: Run tests
        run: pytest --cov=startup_valuation --cov-report=term-missing --cov-fail-under=85 -v

  web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check (tsc)
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check --strict dist/*
