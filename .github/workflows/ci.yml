name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The self-hosted runner set is shared and small; a superseded run that keeps going
# competes for it with the run that replaced it, which is how the `web` job came to
# fail at `pnpm install` on main while the same commit passed on its pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: [self-hosted, apg-ci-04]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src/ tests/ api/ method_registry/ scripts/

      - name: Type check
        run: mypy src/startup_valuation --ignore-missing-imports

      - name: Registry + MCP surface determinism gate
        run: |
          python scripts/generate.py
          python scripts/generate_mcp.py
          git diff --exit-code -- lib/methods/ || (echo "lib/methods/*.ts are out of date; run 'python scripts/generate.py'." && exit 1)
          git diff --exit-code -- src/startup_valuation/mcp/server.py || (echo "src/startup_valuation/mcp/server.py is out of date; run 'python scripts/generate_mcp.py'." && exit 1)

      - name: Run tests
        run: pytest --cov=startup_valuation --cov-report=term-missing --cov-fail-under=85 -v

      # The delivery-contract checks live here, not in `web`: this job installs pytest, and it runs
      # on the 3.10–3.12 matrix, so a script written for one interpreter is caught by the others. A
      # gate that fails for an environmental reason is the gate somebody deletes.
      # The directory, not one file: a check added beside the others must run without anyone
      # remembering to name it here — that is how a gate silently stops covering its class.
      - name: Delivery contract (pin checker and the docs rewriter)
        run: python3 -m pytest tests-ci/ -q

      - name: Delivery contract (health gate behaviour)
        run: python3 tests-ci/health_gate_sim.py

      # The report a failed rollout files is the only thing an operator sees, and every marker it can
      # print has been the wrong one at least once. Behaviour, not text: the loop is extracted from
      # the workflow and run against stub bodies.
      - name: Delivery contract (digest sampler markers)
        run: python3 tests-ci/sampler_sim.py

  web:
    permissions:
      contents: read
    runs-on: [self-hosted, apg-ci-04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          # Pin the version: the runner shares one ~/setup-pnpm between repositories, so a
          # pnpm left there by another repo can shadow this one (apg-infra OI-34).
          # Do NOT set `dest` here: `dest: ${{ runner.temp }}` points at the runner's temp
          # root and the action then fails with "Missing file at path:
          # …/_temp/_runner_file_commands/add_path_…". Measured on PR #74. The shared-store
          # hazard is instead contained by --frozen-lockfile and the concurrency group.
          version: 10.30.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      # The delivery chain's invariants live across seven workflow files, by hand. actionlint checks
      # syntax and action names; it cannot know that a job needs a scope or that two files must
      # agree. Four of these checks correspond to defects that were already shipped once: a
      # zero-scope token, a paths filter that made a required check impossible, a reporter the
      # diagnosis step could not parse, and an expression interpolated into shell on the runner
      # that holds the Docker socket.
      #
      # No npm install is needed — the test uses node: built-ins only — but it does shell out to
      # `python3` to exercise the pin checker, so the runner image must carry an interpreter. The
      # `test` job installs one through setup-python; this job relies on the system python3.
      - name: Delivery contract (workflow invariants)
        run: node --test --test-reporter=spec tests-ci/workflows.test.mjs



  build:
    permissions:
      contents: read
    runs-on: [self-hosted, apg-ci-04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check --strict dist/*
