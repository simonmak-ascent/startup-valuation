name: MCP Tool Definition Quality

on:
  pull_request:
    paths:
      - "src/startup_valuation/mcp/**"
      - "api/index.py"
      - "scripts/generate_mcp.py"
  push:
    branches: [main]
    paths:
      - "src/startup_valuation/mcp/**"
      - "api/index.py"

permissions:
  contents: read

jobs:
  tdqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install library + MCP deps
        run: pip install -e ".[mcp]"

      # Deterministic stages only (context signals, hard gates, shadow prefilter).
      # The model-graded `score` runs on Glama's sweep and needs an API key.
      - name: Lint the MCP tool surface (Glama TDQS)
        run: npx --yes mcp-tdqs@0.2.0 lint --command "python -m startup_valuation.mcp.server" --fail-on error
