name: e2e-deployed

# End-to-end verification of the DEPLOYED product.
#
# This is a gate, not a smoke probe. It runs the same suite in two places:
#
#   * after every rollout, because a rollout reporting success is not the site working
#     (deploy-digest.yml calls this workflow through `uses:`);
#   * on a schedule, because the live host can drift without anyone merging anything —
#     a certificate, a routing rule, an expiring credential.
#
# A red run means the product on the internet does not serve the contract this repository
# declares. compliance.json records the same contract in machine-readable form.
#
# Run it by hand against any deployment:
#   gh workflow run e2e-deployed.yml -f base_url=https://startup-valuation.ascent-partners.com

on:
  workflow_call:
    inputs:
      base_url:
        description: "Origin to verify"
        required: false
        type: string
        default: https://startup-valuation.ascent-partners.com
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to verify"
        required: false
        type: string
        default: https://startup-valuation.ascent-partners.com
  schedule:
    # Twice a day is enough to catch drift; the post-deploy run covers change.
    - cron: "0 1,13 * * *"

permissions:
  contents: read
  issues: write        # the failure path files the diagnosis for the fix stage

concurrency:
  # One group for every mode. The schedule resolves base_url to empty and the post-deploy call
  # always passes one, so the two used to sit in different groups and could run at once on the
  # same runner — where they read and overwrite each other's log file.
  group: e2e-deployed
  cancel-in-progress: false

jobs:
  deployed:
    runs-on:
      - self-hosted
      - apg-ci-04
    # The suite's own worst case is a 15-minute fleet poll plus one final round of 12 sequential
    # probes. A probe that stalls is bounded now, but the job should not rely on that: without this
    # the limit is GitHub's 360-minute default, on a shared runner inside `concurrency:
    # e2e-deployed` with `cancel-in-progress: false` — a hung run blocks the post-deploy gate that
    # waits on it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      # No install step: the suite is node:test + fetch, so there is nothing to resolve and
      # no browser binary to fetch over the NAT.
      - name: Verify the deployed product
        id: suite
        env:
          DEPLOYED_BASE_URL: ${{ inputs.base_url || 'https://startup-valuation.ascent-partners.com' }}
          # A fixed /tmp path is shared state on a persistent runner; two runs (or a leftover from
          # a previous one) would read each other's log. RUNNER_TEMP is per-job.
          E2E_LOG: ${{ runner.temp }}/e2e.log
        run: |
          set -o pipefail
          # stdout is a pipe here, and Node picks the `tap` reporter whenever stdout is not a TTY —
          # TAP failures are `not ok N - name`, never `✖ name`. The diagnosis step parses `✖`, so
          # the reporter is pinned rather than left to the terminal.
          node --test --test-reporter=spec tests-deployed/*.test.mjs 2>&1 | tee "$E2E_LOG"

      - name: Summarise the failure
        if: failure()
        env:
          DEPLOYED_BASE_URL: ${{ inputs.base_url || 'https://startup-valuation.ascent-partners.com' }}
        run: |
          {
            echo "### the deployed product failed its contract"
            echo ""
            echo "Origin: `${DEPLOYED_BASE_URL}`"
            echo ""
            echo "A red run here means the host is not serving what this repository declares —"
            echo "not that a unit test is wrong. Check the routing rules and the running digest"
            echo "before re-running."
          } >> "$GITHUB_STEP_SUMMARY"

      # Stage A of the self-healing loop (docs/delivery-gates.md): a red run produces a
      # diagnosis, not just a notification. One open issue per failing set, updated in place,
      # so a recurring breakage does not spawn a ticket every six hours.
      - name: File or update the failure diagnosis
        if: failure()
        env:
          DEPLOYED_BASE_URL: ${{ inputs.base_url || 'https://startup-valuation.ascent-partners.com' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGIN: ${{ inputs.base_url || 'https://startup-valuation.ascent-partners.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_LOG: ${{ runner.temp }}/e2e.log
        run: |
          set -eu
          failing="$(grep -E '^✖ ' "$E2E_LOG" | sed 's/ ([0-9.]*ms)//' | sort -u | head -12 || true)"
          [ -n "$failing" ] || failing="(no individual test names parsed — see the run log)"
          # The test *name* cannot tell a dead host from a split fleet: both fail the same test and
          # differ only in the assertion message. Including that message in the fingerprint is what
          # makes "unreachable" and "serving an older build" file as different issues instead of
          # one issue whose body lists a cause that does not apply.
          reasons="$(grep -oE 'AssertionError[^:]*: .*|Error: .*' "$E2E_LOG" | sed 's/[[:space:]]*$//' | sort -u | head -6 || true)"
          # Hash the *condition*, not the transport noise: an `Error: connect ECONNREFUSED
          # 10.20.12.81:443` line carries a per-node address, so a single flapping probe would flip
          # the fingerprint for an unchanged breakage and split it across two issues. The raw text
          # still goes in the body.
          hashed="$(printf '%s\n%s' "$failing" "$reasons" | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?/<addr>/g')"
          fingerprint="$(printf '%s' "$hashed" | sha256sum | cut -c1-12)"
          title="e2e failure (${fingerprint}): the deployed product does not serve the contract"

          {
            echo 'The deployed origin failed the end-to-end contract.'
            echo
            echo "- origin: \`${ORIGIN}\`"
            echo "- run: ${RUN_URL}"
            echo "- failing set fingerprint: \`${fingerprint}\` (one issue per distinct set)"
            echo
            echo '## Failing assertions'
            echo
            echo '```'
            echo "$failing"
            echo '```'
            if [ -n "$reasons" ]; then
              echo
              echo '## What the assertions said'
              echo
              echo '```'
              echo "$reasons"
              echo '```'
              echo
              echo 'Read this first: it distinguishes "no node answered" from "a node answered with'
              echo 'the wrong build", and the two have different fixes.'
            fi
            echo
            echo '## What this does and does not mean'
            echo
            echo 'A red run means the host is not serving what this repository declares — not that a'
            echo 'unit test is wrong. The usual causes, in order: a node is unreachable or draining,'
            echo 'the fleet is split across two digests, the ALB routing does not match'
            echo 'docs/plan-delivery.md, or the fix is merged but not deployed.'
            echo
            echo '## Fix loop'
            echo
            echo 'Stage B of docs/delivery-gates.md fixes this automatically **when** a runner has a'
            echo 'model credential and an agent auth store readable by the runner user. Until then this'
            echo 'issue is the handoff: the diagnosis is here and the change still goes through'
            echo 'review -> PR -> checks -> merge -> deploy -> e2e like every other.'
            echo
            echo 'Do **not** make this pass by changing tests-deployed/ or compliance.json —'
            echo 'guard-tamper blocks that for automated authors.'
          } > "$RUNNER_TEMP/issue.md"

          # No external `jq`: every other workflow in this repository uses gh's built-in --jq, and
          # gh's --jq has no --arg, so a title with a quote in it breaks the program. python3 is
          # already a dependency of this job's siblings; use it to match on the title exactly.
          export TITLE="$title"
          # One line on purpose: a multi-line single-quoted argument would have to carry the block's
          # indentation into the Python source, which YAML then reads as a dedent. python3 replaces
          # the external jq this step used to need — gh's own --jq has no --arg, so a title with a
          # quote in it broke the program.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            | TITLE="$title" python3 -c 'import json,os,sys; w=os.environ["TITLE"]; print(next((i["number"] for i in json.load(sys.stdin) if i.get("title")==w), ""))')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md" --label e2e-failure \
              || gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
