[build-system]
# Pinned, because the backend decides the artefact's bytes *and* its metadata version: hatchling
# 1.32.0 silently changed the default from 2.4 to 2.5, which broke a twine pinned below the reader
# that supports it. This line is what a *consumer* building from the sdist resolves. Our own builds
# do not use it: they run with `--no-isolation` against the copy pinned by hash in
# `requirements/publish.txt`, which `tests-ci/test_sdist_contents.py` keeps in step with this line.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "startup-valuation"
version = "2.1.5"
description = "Comprehensive startup valuation library implementing 80+ formulas from the Startup Valuation textbook. Includes Python library, MCP server, and AI-Agent Skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Simon Mak" }
]
keywords = ["valuation", "startup", "finance", "vc", "mcp", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0",
]
sentry = [
    "sentry-sdk>=1.40.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # `tests-ci/test_sdist_contents.py` builds the sdist and inspects its members: a checker that
    # only reads `pyproject.toml` cannot see a stray file committed inside the package directory.
    "build>=1.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
startup-valuation-mcp = "startup_valuation.mcp.server:main"

[project.urls]
Homepage = "https://github.com/simonmak-ascent/startup-valuation"
Documentation = "https://simonmak-ascent.github.io/startup-valuation"
Repository = "https://github.com/simonmak-ascent/startup-valuation"
"Bug Tracker" = "https://github.com/simonmak-ascent/startup-valuation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/startup_valuation"]

[tool.hatch.build.targets.sdist]
# The deliverable is the package, not the repository. An allowlist, not an exclude list: the
# exclude list named a handful of artefacts and the sdist still shipped 704 KB of web app, docs and
# CI — every `pip download --no-binary` consumer got a tarball of the repository. Measured before
# this change: 37 files from tests*/, 38 from docs/, 62 from app|components|lib.
#
# `/src/startup_valuation/`, not `/src/`: `src/wasm/` is the optional Rust crate and is not part of
# the Python package. Hatchling always adds `pyproject.toml`, the declared readme and licence files,
# and the root `.gitignore`, whether or not they are listed here — the entries below are the files
# whose absence would break a build from the sdist.
include = [
  "/src/startup_valuation/",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
# Make the library importable so tests can import `startup_valuation` (and
# `startup_valuation.mcp`) without an install step.
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Generated stdio server: emit from src/startup_valuation/mcp/tool_surface.py via
# scripts/generate_mcp.py. Excluded from lint/format so codegen stays byte-stable.
extend-exclude = ["src/startup_valuation/mcp/server.py", ".deploy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Canonical tool surface: long single-line description strings are data, not code.
"src/startup_valuation/mcp/tool_surface.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
