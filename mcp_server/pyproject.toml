[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startup-valuation-mcp"
version = "1.0.0"
description = "MCP server for the Startup Valuation Engine"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "startup-valuation>=1.0.0",
]

[project.urls]
Repository = "https://github.com/simonplmak-cloud/startup-valuation"
