[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startup-valuation-mcp"
version = "2.0.0"
description = "MCP server for the Startup Valuation Engine — 14 tools covering 80+ startup valuation formulas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Simon Mak" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "valuation", "startup", "finance", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=2.0.0",
    "startup-valuation>=1.0.2",
]

[project.optional-dependencies]
deps = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
startup-valuation-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/simonplmak-cloud/startup-valuation"
Repository = "https://github.com/simonplmak-cloud/startup-valuation"
"Bug Tracker" = "https://github.com/simonplmak-cloud/startup-valuation/issues"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "tool_surface.py"]
